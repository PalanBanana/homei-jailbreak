name: swift-build

# Compiles and tests the Swift code on a GitHub-hosted macOS runner, then builds the iOS Simulator
# target with code signing disabled. It never targets a physical device, needs no signing identity,
# and uploads no IPA or other build product.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version) ($(xcrun --sdk iphonesimulator --show-sdk-path))"
          xcodebuild -showsdks | grep -i simulator || true

      - name: Swift package tests (HomeiKit, including Rust/Swift parity vectors)
        run: swift test --package-path .

      - name: Install XcodeGen if it is not already available
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate the Xcode project
        run: xcodegen generate --spec App/project.yml

      - name: Inspect the generated project
        run: |
          ls -d App/*.xcodeproj
          xcodebuild -list -project App/HOMEI.xcodeproj

      - name: Build the HOMEI iOS Simulator target (code signing disabled)
        run: |
          set -o pipefail
          SCHEME="$(xcodebuild -list -project App/HOMEI.xcodeproj -json | python3 -c 'import json,sys; s=json.load(sys.stdin)["project"]["schemes"]; print("HOMEI" if "HOMEI" in s else "")')"
          if [ -z "$SCHEME" ]; then echo "No HOMEI scheme was generated"; exit 1; fi
          echo "Building scheme: $SCHEME"
          xcodebuild build \
            -project App/HOMEI.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log

      - name: Summarise compiler warnings
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "Warnings: $(grep -c ' warning: ' build.log || true)"
            grep ' warning: ' build.log | sort -u | head -60 || true
          fi

      - name: Check the built app bundle
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/HOMEI.app"
          test -d "$APP"
          echo "--- bundle contents"; ls "$APP"
          for f in evidence compatibility research-index device-fixtures catalog; do
            test -f "$APP/$f.json" || { echo "missing bundled $f.json"; exit 1; }
          done
          test -d "$APP/en.lproj" && test -d "$APP/ko.lproj"
          test -f "$APP/Assets.car"
          echo "--- Info.plist"; plutil -p "$APP/Info.plist"
          echo "--- no IPA produced"; ! find build -name '*.ipa' | grep -q .

  ui-tests:
    # Runs the app on an iOS Simulator and checks what each screen says, what it must not offer,
    # Korean text, the largest text size, and Apple's accessibility audit. Simulator only.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install XcodeGen if it is not already available
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate the Xcode project
        run: xcodegen generate --spec App/project.yml

      - name: Pick an iPhone simulator
        id: sim
        run: |
          xcrun simctl list devices available
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          phones = []
          for runtime, devices in data.items():
              for d in devices:
                  if d["name"].startswith("iPhone") and "iOS" in runtime:
                      phones.append((runtime, d["name"], d["udid"]))
          phones.sort()
          preferred = [p for p in phones if p[1] == "iPhone 17 Pro"] or phones
          print(preferred[-1][2])
          ')"
          echo "Selected simulator: $SIM_ID"
          xcrun simctl list devices available | grep "$SIM_ID" || true
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: Run the UI tests (code signing disabled)
        run: |
          set -o pipefail
          xcodebuild test \
            -project App/HOMEI.xcodeproj \
            -scheme HOMEI \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ui-test.log

      - name: Export screenshots and accessibility audit records
        if: always()
        run: |
          mkdir -p build/attachments build/upload
          if [ -d build/ui-tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/ui-tests.xcresult || true
            xcrun xcresulttool export attachments --path build/ui-tests.xcresult --output-path build/attachments || true
          fi
          ls build/attachments | wc -l
          # Keep screenshots, audit records and the manifest. Screen recordings are not uploaded.
          cp build/attachments/manifest.json build/upload/ 2>/dev/null || true
          find build/attachments -maxdepth 1 \( -name '*.png' -o -name '*.json' -o -name '*.txt' \) -exec cp {} build/upload/ \;
          du -sh build/upload

      - name: Summarise the contrast and accessibility audit
        if: always()
        run: python3 scripts/summarize_ui_audit.py build/attachments

      - name: Upload screenshots and audit records (no screen recordings, no build products)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-test-attachments
          path: build/upload
          retention-days: 14
          if-no-files-found: warn
