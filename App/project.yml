# XcodeGen project description for the HOMEI iOS app. Generate the Xcode project on macOS with:
#   xcodegen generate --spec App/project.yml
# This file is a source description only. The project has not been generated or built in the
# Linux development environment, so no iOS binary exists. See Docs/DEVELOPMENT.md.
name: HOMEI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  HomeiKit:
    path: ..
targets:
  HOMEI:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["Kit/**"]
      - path: Views
      - path: Components
      - path: Resources
        excludes: ["Branding/**"]
    resources:
      - path: ../Data/evidence.json
      - path: ../Data/compatibility.json
      - path: ../Data/research-index.json
      - path: ../Data/device-fixtures.json
      - path: ../Catalog/Packages/catalog.json
    dependencies:
      - package: HomeiKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: HOMEI
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleLocalizations: [en, ko]
        CFBundleDevelopmentRegion: en
    # Deliberately empty: no entitlements, no background modes, no USB or network usage
    # descriptions, no device-management capabilities.
    entitlements:
      path: Resources/HOMEI.entitlements
      properties: {}
