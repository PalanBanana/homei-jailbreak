# XcodeGen description of the HOMEI iOS app.
#   xcodegen generate --spec App/project.yml        (writes App/HOMEI.xcodeproj, which is not committed)
# The GitHub Actions workflow .github/workflows/swift-build.yml generates the project and builds the
# iOS Simulator target with code signing disabled. Nothing here targets a physical device.
name: HOMEI
options:
  bundleIdPrefix: com.example
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  HomeiKit:
    path: ..
targets:
  HOMEI:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["Kit/**"]
      - path: Views
      - path: Components
      - path: Resources
        excludes: ["Branding/**", "*.entitlements"]
      # Bundled data. HomeiKit reads these four files, the catalog and the lab state from the app bundle.
      - path: ../Data/evidence.json
        buildPhase: resources
      - path: ../Data/compatibility.json
        buildPhase: resources
      - path: ../Data/research-index.json
        buildPhase: resources
      - path: ../Data/device-fixtures.json
        buildPhase: resources
      - path: ../Catalog/Packages/catalog.json
        buildPhase: resources
      # Sanitized lab state exported by the host controller (Data/lab/lab-state.json). Read only.
      - path: ../Data/lab/lab-state.json
        buildPhase: resources
      # Firmware research exports (static analysis, feasibility matrix, SPTM register summary). Read only.
      - path: ../Data/research/t8130-firmware-analysis.json
        buildPhase: resources
      - path: ../Data/research/t8130-feasibility.json
        buildPhase: resources
      - path: ../Data/research/t8130-sptm-census.json
        buildPhase: resources
    dependencies:
      - package: HomeiKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.homei
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The Info.plist is generated from build settings, so no plist file is kept in the repository.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HOMEI
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Deliberately empty entitlements: no capabilities, background modes or device access.
        CODE_SIGN_ENTITLEMENTS: Resources/HOMEI.entitlements
  HOMEIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../Tests/UITests
    dependencies:
      - target: HOMEI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.homei.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  HOMEI:
    build:
      targets:
        HOMEI: all
    test:
      targets:
        - HOMEIUITests
